name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Python Causal Engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Causal Foundation Pipeline
        run: |
          python scripts/run_causal_pipeline.py

      - name: Train DML Estimator
        run: |
          python scripts/train_dml.py

      - name: Run Pytest Suite
        run: |
          pytest -v

  frontend-tests:
    name: Frontend React Dashboard (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test -- --run

      - name: Build Frontend Production Bundle
        run: npm run build
